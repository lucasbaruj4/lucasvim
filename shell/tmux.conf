unbind C-b
set-option -g prefix M-t
bind-key M-t send-prefix

unbind v
unbind h 
unbind w
unbind x

set -g mouse off
set -s copy-command '/mnt/c/Windows/System32/clip.exe'
set -g extended-keys on
set -g extended-keys-format csi-u

bind-key v split-window -v -c "#{pane_current_path}"
bind-key b split-window -h -c "#{pane_current_path}"
bind-key x kill-pane
bind-key d kill-window
bind-key          , command-prompt "rename-window '%%'"

bind-key r source-file ~/.tmux.conf

# Quick screenshot with Alt+Shift+S, or Alt+t then s/Shift+s.
# Takes full desktop screenshot, saves it, and puts the WSL path on the clipboard.
# Then just Ctrl+Shift+V to paste the path. No manual Win+Shift+S needed.
bind-key s run-shell '~/.local/bin/take-screenshot'
bind-key S run-shell '~/.local/bin/take-screenshot'

# changing design
set -g status-position top
# Pane dividers match the system blue accent.
set -g pane-border-style 'fg=#7aa2f7'
set -g pane-active-border-style 'fg=#7aa2f7'
set -g mode-style 'fg=#000000,bg=#ffd700,bold'
set -g copy-mode-selection-style 'fg=#000000,bg=#ffd700,bold'
set -g status-style 'fg=#aaa8b5,bg=default'
set -g status-left-style 'fg=#aaa8b5,bg=default'
set -g status-right-style 'fg=#7aa2f7,bg=default'
set -g status-left ""
set -g status-right ""
set -g window-status-style 'fg=#777481,bg=default'
set -g window-status-current-style 'fg=#0a0a0a,bg=#7aa2f7,bold'
set -g window-status-separator ' '
set -g window-status-current-format ' [#I:#W] '
set -g window-status-format '#I:#W'
set -g base-index 1
set -g renumber-windows on

# vim keybindings for panel hopping
bind-key -T prefix h select-pane -L
bind-key -T prefix j select-pane -D
bind-key -T prefix k select-pane -U
bind-key -T prefix l select-pane -R

# One-chord Alt shortcuts. Keep Alt+t then v for vertical split because Alt+v
# is used elsewhere. Existing prefix bindings remain available as fallbacks.
bind-key -n M-b split-window -h -c "#{pane_current_path}"
bind-key -n M-c new-window -c "#{pane_current_path}"
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
bind-key -n M-x kill-pane
bind-key -n M-z resize-pane -Z
bind-key -n M-d kill-window
bind-key -n M-, command-prompt "rename-window '%%'"
bind-key -n M-S-r source-file ~/.tmux.conf
bind-key -n M-S-s run-shell '~/.local/bin/take-screenshot'

# Quick window ("tab") switching, no prefix needed: PageUp/PageDown jump
# left/right between tmux windows. Note: this means PageUp/PageDown no
# longer reach whatever app has focus (e.g. scrolling in vim/less) --
# they're claimed globally by tmux instead.
bind-key -n PageUp previous-window
bind-key -n PageDown next-window

# --- persistence across WSL shutdowns ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

run '~/.tmux/plugins/tpm/tpm'


# Alt+S: stop current speech; again when silent = mute/unmute
bind-key -n M-s run-shell -b "~/.claude/voice/shush.sh"
# Alt+R: replay the last spoken output for this window
bind-key -n M-r run-shell -b "~/.claude/voice/repeat.sh '#{pane_id}'"
